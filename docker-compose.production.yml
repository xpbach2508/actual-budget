services:
  actual_server:
    image: ghcr.io/xpbach2508/actual-budget:master
    ports:
      - '5006:5006'
    environment:
      ACTUAL_DATA_DIR: /data
      TZ: ${TZ:-Asia/Ho_Chi_Minh}
    volumes:
      - ${ACTUAL_DATA_DIR_HOST:?Set ACTUAL_DATA_DIR_HOST to the host Actual data directory}:/data
    networks:
      - actual_net
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(\"http://localhost:5006/health\").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

networks:
  actual_net:
    external: true
    name: ${ACTUAL_NETWORK_NAME:-actual_budget_default}
