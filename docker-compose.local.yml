###################################################
# Local browser development with Docker HMR.
#
#   docker compose -f docker-compose.local.yml up
#
# Open http://localhost:5173. Source edits hot-reload; do not use --build.
# Budget/sync state remains in the existing actual-data named volume.
###################################################

services:
  actual:
    image: node:22-bookworm
    working_dir: /app
    ports:
      - '5173:5173'
      - '5006:5006'
    environment:
      ACTUAL_DATA_DIR: /data
      TZ: Asia/Ho_Chi_Minh
      CHOKIDAR_USEPOLLING: 'true'
      WATCHPACK_POLLING: 'true'
    volumes:
      - .:/app
      - actual-node-modules:/app/node_modules
      - actual-data:/data
    command: >
      bash -lc "corepack enable && yarn install --immutable && yarn start:browser"
    restart: unless-stopped

volumes:
  actual-data:
  actual-node-modules:
