###################################################
# Runs a production-like Actual instance built from
# the LOCAL working tree, so local code changes are
# what actually gets served.
#
#   docker compose -f docker-compose.local.yml up --build
#
# Then open http://localhost:5006
#
# The sync-server serves both the API and the built
# web client, so this is the only service needed.
# Rebuild (`--build`) after changing any source.
###################################################

services:
  actual:
    build:
      context: .
      dockerfile: sync-server.Dockerfile
    image: actual-local:dev
    ports:
      - '5006:5006'
    environment:
      - ACTUAL_DATA_DIR=/data
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      # Named volume keeps your budget + sync state across rebuilds.
      - actual-data:/data
    restart: unless-stopped

volumes:
  actual-data:
